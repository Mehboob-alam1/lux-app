# Netlify deploy for LUX Admin Command console
[build]
  command = "npm run build -w @lux/contracts && npm run build -w @lux/admin-web"
  publish = "apps/admin_web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Set these in Netlify UI → Site settings → Environment variables:
# NEXT_PUBLIC_USE_EMULATORS=false
# NEXT_PUBLIC_FIREBASE_API_KEY
# NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
# NEXT_PUBLIC_FIREBASE_PROJECT_ID
# NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
# NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
# NEXT_PUBLIC_FIREBASE_APP_ID
# NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID (optional)
# NEXT_PUBLIC_FIREBASE_DATABASE_URL (optional)
