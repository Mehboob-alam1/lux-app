  intl: ^0.19.0
  shared_preferences: ^2.5.2
  http: ^1.6.0
  geolocator: ^14.1.2
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
